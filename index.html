<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14452F">
<title>Türkiye Katmanları</title>
<style>
:root{--bg:#F3EEE3;--surface:#FFFDF8;--surface-2:#F8F3E8;--ink:#1A2822;--muted:#66706A;--line:#E3DBC9;--green:#14452F;--green-2:#1F6B4A;--green-3:#DDEBE2;--gold:#B98A2E;--gold-soft:#F4E7BE;--maroon:#6B1425;--radius:18px;--shadow:0 1px 2px rgba(26,40,34,.06),0 8px 24px rgba(26,40,34,.08);--none:#E9E1CF;--accent:#14452F;
--era-s1:#A5712C;--era-s2:#8E4B3A;--era-s3:#B03A48;--era-s4:#1F6B6B;--era-s5:#2F5D8A;--era-s6:#3E4A44;--era-nature:#3F7D3A;color-scheme:light}
:root[data-theme=dark]{--bg:#0E1613;--surface:#16211C;--surface-2:#1C2924;--ink:#E8EEE9;--muted:#93A39A;--line:#2B3B34;--green:#1F7A52;--green-2:#2E9A6A;--green-3:#1F3A2D;--gold:#D3A648;--gold-soft:#3A3012;--none:#1A2621;--accent:#7FD3A8;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;color:var(--accent);letter-spacing:.2px}
h1 small{color:var(--maroon);font-weight:600}
nav{font-size:.9rem;color:var(--muted);flex:1;min-width:140px}
nav a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
button{font:inherit;cursor:pointer}
.ic{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
#mapbox{padding:10px;position:sticky;top:70px;align-self:start}
@media(max-width:860px){#mapbox{position:static}}
svg{width:100%;height:auto;max-height:72vh;display:block}
svg path{stroke:var(--surface);stroke-width:.6;vector-effect:non-scaling-stroke;transition:filter .15s}
svg path.on{cursor:pointer}svg path.on:hover{filter:brightness(1.12);stroke:var(--gold);stroke-width:1.6}
svg g.on{cursor:pointer}svg g.on:hover{filter:brightness(1.15)}
svg path.sel{stroke:var(--maroon);stroke-width:2.2}
svg text{font-size:var(--fs,9px);fill:var(--ink);pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:2.5px}
.hint{color:var(--muted);font-size:.85rem;padding:6px 8px}
#panel{padding:14px}
#panel h2{margin:0 0 4px;font-size:1.1rem}
.bar{height:8px;background:var(--green-3);border-radius:8px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--gold))}
input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);margin-bottom:10px;font:inherit}
.dgrid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.8rem}
.chip.act{background:var(--green);color:#fff;border-color:var(--green)}
.place{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--surface-2);overflow:hidden}
.place summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center}
.place summary::-webkit-details-marker{display:none}
.place b{flex:1}.place small{color:var(--muted)}
.era{font-size:.7rem;color:#fff;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:#fff}
.place.v .tick{background:var(--green-2);border-color:var(--green-2)}
.body{padding:0 12px 12px;font-size:.92rem}.body p{margin:6px 0}
.body img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:6px}
.meta{color:var(--muted);font-size:.82rem}
.act2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:7px 12px}
.btn.alt{background:var(--surface);color:var(--accent);border:1px solid var(--line);text-decoration:none}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:18px}
</style>
</head>
<body>
<header>
  <h1>Türkiye <small>Katmanları</small></h1>
  <nav id="nav"></nav>
  <button class="ic" id="theme" title="Gece / gündüz">◐</button>
</header>
<main>
  <section class="card" id="mapbox"><svg id="map" role="img" aria-label="Harita"></svg><div class="hint" id="hint"></div></section>
  <section class="card" id="panel"></section>
</main>
<footer>Sınırlar: geoBoundaries (CC BY 4.0) · Yer verisi: © OpenStreetMap katkıda bulunanları (ODbL) · Özetler: Vikipedi (CC BY-SA 4.0)</footer>
<script>
"use strict";
// Verisi hazır iller (plaka: ad). Yeni il eklenince buraya eklenir.
const READY={"06":"Ankara","34":"İstanbul"};
const ERA={ant:["Antik–Bizans","s3"],ott:["Osmanlı","s5"],rep:["Cumhuriyet","s6"],nat:["Doğa","nature"],
 s1:["Hitit–Frig","s1"],s2:["Galat","s2"],s3:["Roma","s3"],s4:["Selçuklu","s4"],s5:["Osmanlı","s5"],s6:["Cumhuriyet","s6"],nature:["Doğa","nature"]};
const $=s=>document.querySelector(s), SVG="http://www.w3.org/2000/svg";
const TRM={"ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u"};
const ALIAS={princeislands:"adalar"};
const key2=s=>{const k=slug(s);return ALIAS[k]||k};
const slug=s=>s.toLocaleLowerCase("tr").replace(/[çğıöşüâîû]/g,c=>TRM[c]).replace(/[^a-z0-9]/g,"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const J=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json()});
let seen={};try{seen=JSON.parse(localStorage.getItem("tk-visited")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("tk-visited",JSON.stringify(seen))}catch(e){}};
const S={il:null,ilData:null,district:null,geoIl:[],q:"",limit:60};

/* ---- tema ---- */
const root=document.documentElement;
root.dataset.theme=localStorage.getItem("tk-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
$("#theme").onclick=()=>{root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("tk-theme",root.dataset.theme)}catch(e){}};

/* ---- harita çizimi ---- */
function project(features){
  let a=[1e9,1e9,-1e9,-1e9];
  features.forEach(f=>f.p.forEach(poly=>poly.forEach(r=>r.forEach(([x,y])=>{a[0]=Math.min(a[0],x);a[1]=Math.min(a[1],y);a[2]=Math.max(a[2],x);a[3]=Math.max(a[3],y)}))));
  const k=Math.cos((a[1]+a[3])/2*Math.PI/180),W=1000,w=(a[2]-a[0])*k,h=a[3]-a[1],sc=W/w,H=h*sc;
  return {pt:([x,y])=>[((x-a[0])*k*sc),((a[3]-y)*sc)],W,H,sc,k};
}
function draw(features,opts){
  const P=project(features),svg=$("#map");svg.innerHTML="";svg.setAttribute("viewBox",`0 0 ${P.W.toFixed(0)} ${P.H.toFixed(0)}`);
  const labels=[];
  features.forEach(f=>{
    let d="",bx=[1e9,1e9,-1e9,-1e9],big=0;
    f.p.forEach(poly=>poly.forEach((ring,ri)=>{
      ring.forEach((c,i)=>{const [x,y]=P.pt(c);d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)});d+="Z";
      if(ri===0){let mn=[1e9,1e9],mx=[-1e9,-1e9];ring.forEach(c=>{const [x,y]=P.pt(c);mn=[Math.min(mn[0],x),Math.min(mn[1],y)];mx=[Math.max(mx[0],x),Math.max(mx[1],y)]});
        const ar=(mx[0]-mn[0])*(mx[1]-mn[1]);if(ar>big){big=ar;bx=[mn[0],mn[1],mx[0],mx[1]]}}
    }));
    const p=document.createElementNS(SVG,"path");p.setAttribute("d",d);p.setAttribute("fill-rule","evenodd");
    const st=opts.style(f);p.style.fill=st.fill;if(st.on){p.classList.add("on");p.onclick=()=>opts.click(f)}
    if(st.sel)p.classList.add("sel");
    const t=document.createElementNS(SVG,"title");t.textContent=st.tip;p.appendChild(t);svg.appendChild(p);
    if(opts.labels&&bx[0]<1e8)labels.push([f.n,(bx[0]+bx[2])/2,(bx[1]+bx[3])/2,bx[2]-bx[0]]);
  });
  if(opts.labels)labels.forEach(([n,x,y,w])=>{if(w<n.length*5.2)return;const t=document.createElementNS(SVG,"text");t.setAttribute("x",x);t.setAttribute("y",y);t.style.setProperty("--fs",Math.max(11,Math.min(20,w/n.length*1.4))+"px");t.textContent=n;svg.appendChild(t)});
}
const mix=r=>`color-mix(in srgb,var(--green-2) ${Math.round(r*100)}%,var(--green-3))`;

/* ---- ilerleme ---- */
const key=(il,d,n)=>il+"|"+d+"|"+n;
function countSeen(il,dist){let c=0;const p=il+"|"+(dist?dist+"|":"");for(const k in seen)if(k.startsWith(p))c++;return c}
async function loadIl(k){
  const meta=await J(`data/${k}.json`);
  const lists=await Promise.all(meta.districts.map(d=>J(`data/${k}/${d.s}.json`).catch(()=>[])));
  meta.districts.forEach((d,i)=>{d.places=lists[i];d.c=lists[i].length||d.c||0});
  return meta;
}

/* ---- görünümler ---- */
function nav(){
  const n=$("#nav");
  if(!S.il){n.textContent="Bir il seçin";return}
  n.innerHTML=`<a id="home">Türkiye</a> › ${S.district?`<a id="il">${esc(S.ilData.name)}</a> › <b>${esc(S.district)}</b>`:`<b>${esc(S.ilData.name)}</b>`}`;
  $("#home").onclick=()=>go(null);if(S.district)$("#il").onclick=()=>pick(null);
}
function viewTR(){
  S.il=null;S.ilData=null;S.district=null;nav();
  if(S.trIlce){drawTRilce()}else
  draw(S.geoIl,{style:f=>{const ok=READY[f.k];
      if(!ok)return{fill:"var(--none)",tip:f.n+" (yakında)"};
      const tot=S.meta?.[f.k]||0,r=tot?Math.min(1,countSeen(f.k)/tot):0;
      return{fill:mix(.15+r*.85),on:true,tip:`${f.n}: ${countSeen(f.k)} / ${tot||"?"} yer`}},
    click:f=>go(f.k),labels:false});
  $("#hint").textContent="Koyu yeşil olan iller açık; diğer iller sırayla eklenecek.";
  const done=Object.keys(READY).map(k=>`<button class="chip" data-k="${k}">${READY[k]}</button>`).join("");
  $("#panel").innerHTML=`<h2>Türkiye Katmanları</h2><p class="meta">Haritadan ya da aşağıdan bir il seçin. Gezdiğin yerleri işaretledikçe harita yeşile döner.</p><div class="dgrid">${done}</div>`;
  $("#panel").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function drawTRilce(){
  const svg=$("#map"),P=project(S.geoIl);svg.innerHTML="";svg.setAttribute("viewBox",`0 0 ${P.W.toFixed(0)} ${P.H.toFixed(0)}`);
  const by={};S.geoIl.forEach(f=>(by[f.k]=by[f.k]||[]).push(f));
  const D=f=>{let d="";f.p.forEach(poly=>poly.forEach(r=>{r.forEach((c,i)=>{const [x,y]=P.pt(c);d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)});d+="Z"}));return d};
  Object.keys(by).sort().forEach(k=>{
    const ok=READY[k],tot=S.meta[k]||0,sn=countSeen(k),r=tot?Math.min(1,sn/tot):0,fill=ok?mix(.15+r*.85):"var(--none)";
    const g=document.createElementNS(SVG,"g");
    [["var(--surface)",2.6],[fill,1.1]].forEach(([c,w])=>by[k].forEach(f=>{
      const p=document.createElementNS(SVG,"path");p.setAttribute("d",D(f));p.setAttribute("fill-rule","evenodd");
      p.style.fill=fill;p.style.stroke=c;p.style.strokeWidth=w;p.style.vectorEffect="non-scaling-stroke";g.appendChild(p)}));
    const nm=by[k][0].i||("Plaka "+k),t=document.createElementNS(SVG,"title");
    t.textContent=ok?`${nm}: ${sn} / ${tot||"?"} yer`:nm+" (yakında)";g.appendChild(t);
    if(ok){g.classList.add("on");g.onclick=()=>go(k)}
    svg.appendChild(g);
  });
}
async function go(k){
  if(!k)return viewTR();
  $("#panel").innerHTML='<p class="hint">Yükleniyor…</p>';
  try{S.ilData=await loadIl(k)}catch(e){$("#panel").innerHTML='<p class="hint">Bu ilin verisi yüklenemedi.</p>';return}
  S.il=k;S.district=null;S.q="";S.limit=60;
  try{S.geoDist=(await J(`data/geo/${k}.json`)).features}catch(e){S.geoDist=null}
  pick(null);
}
function pick(d){S.district=d;S.limit=60;nav();drawIl();panel()}
function drawIl(){
  const dd={};S.ilData.districts.forEach(x=>dd[slug(x.n)]=x);
  const feats=S.geoDist&&S.geoDist.map(f=>{const x=dd[key2(f.n)];return x?{...f,n:x.n}:f});
  if(!S.geoDist){$("#map").innerHTML="";$("#hint").textContent="Bu ilin ilçe sınırları henüz eklenmedi; ilçeleri sağdan seçebilirsiniz.";return}
  draw(feats,{labels:true,style:f=>{const x=dd[slug(f.n)];
      if(!x)return{fill:"var(--none)",tip:f.n};
      const r=x.c?Math.min(1,countSeen(S.il,x.n)/x.c):0;
      return{fill:mix(.15+r*.85),on:true,sel:S.district===x.n,tip:`${x.n}: ${countSeen(S.il,x.n)} / ${x.c} yer`}},
    click:f=>{const x=dd[slug(f.n)];pick(S.district===x.n?null:x.n)}});
  $("#hint").textContent="Bir ilçeye dokunarak yerlerini listeleyin.";
}
function panel(){
  const D=S.ilData.districts,tot=D.reduce((a,x)=>a+x.c,0),sn=countSeen(S.il);
  const chips=`<button class="chip ${S.district?"":"act"}" data-d="">Tümü</button>`+D.filter(x=>x.c).map(x=>`<button class="chip ${S.district===x.n?"act":""}" data-d="${esc(x.n)}">${esc(x.n)} ${countSeen(S.il,x.n)}/${x.c}</button>`).join("");
  $("#panel").innerHTML=`<h2>${esc(S.district||S.ilData.name)}</h2>
   <div class="meta">${S.district?countSeen(S.il,S.district)+" / "+(D.find(x=>x.n===S.district)?.c||0):sn+" / "+tot} yer gezildi</div>
   <div class="bar"><i style="width:${S.district?(100*countSeen(S.il,S.district)/Math.max(1,D.find(x=>x.n===S.district)?.c||1)):(100*sn/Math.max(1,tot))}%"></i></div>
   <input type="search" id="q" placeholder="Yer ara…" value="${esc(S.q)}"><div class="dgrid">${chips}</div><div id="list"></div>`;
  $("#panel").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>pick(b.dataset.d||null));
  $("#q").oninput=e=>{S.q=e.target.value;S.limit=60;panelList()};
  panelList();
}
function panelList(){
  const D=S.ilData.districts,q=slug(S.q);
  let list=(S.district?D.filter(x=>x.n===S.district):D).flatMap(x=>x.places.map(p=>({...p,_d:x.n})));
  if(q)list=list.filter(p=>slug(p.name+p.type).includes(q));
  list.sort((a,b)=>(a.rank??1e9)-(b.rank??1e9)||a.name.localeCompare(b.name,"tr"));
  const L=$("#list");L.innerHTML="";
  list.slice(0,S.limit).forEach(p=>{
    const k=key(S.il,p._d,p.name),e=ERA[p.era],d=document.createElement("details");d.className="place"+(seen[k]?" v":"");
    d.innerHTML=`<summary><span class="tick">${seen[k]?"✓":""}</span><b>${esc(p.name)}<br><small>${esc(p._d)} · ${esc(p.type||"")}</small></b>${e?`<span class="era" style="background:var(--era-${e[1]})">${e[0]}</span>`:""}</summary>
     <div class="body">${p.img?`<img loading="lazy" src="${esc(p.img)}" alt="" onerror="this.remove()">`:""}
     <p class="meta">${esc(p.period||"")}${p.founder&&p.founder!=="Bilinmiyor"?" · Yapan: "+esc(p.founder):""}${p.fee?" · "+esc(p.fee):""}${p.hours?" · "+esc(p.hours):""}</p>
     <p>${esc(p.story||"")}</p>
     <div class="act2"><button class="btn">${seen[k]?"Gezmedim":"Gezdim ✓"}</button><a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.mapQuery||p.name)}">Haritada aç</a></div></div>`;
    d.querySelector(".btn").onclick=()=>{if(seen[k])delete seen[k];else seen[k]=1;save();drawIl();panel()};
    L.appendChild(d);
  });
  if(list.length>S.limit){const m=document.createElement("button");m.className="btn alt";m.textContent=`Daha fazla göster (${list.length-S.limit})`;m.onclick=()=>{S.limit+=60;panelList()};L.appendChild(m)}
  if(!list.length)L.innerHTML='<p class="hint">Bu aramada yer bulunamadı.</p>';
}

/* ---- açılış ---- */
(async()=>{
  try{try{S.geoIl=(await J("data/geo/turkiye.json")).features;S.trIlce=true}catch(e){S.geoIl=(await J("data/geo/il.json")).features}}catch(e){$("#panel").innerHTML='<p class="hint">Harita verisi (data/geo) yüklenemedi.</p>';return}
  S.meta={};
  await Promise.all(Object.keys(READY).map(k=>J(`data/${k}.json`).then(m=>S.meta[k]=m.districts.reduce((a,d)=>a+(d.c||0),0)).catch(()=>{})));
  viewTR();
})();
</script>
</body>
</html>
